<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeetPlus | Quantum Intelligence Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap');
        
        :root {
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --bg-dark: #020617;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-dark); 
            color: #f8fafc; 
            overflow-x: hidden;
        }

        /* Animated Background */
        .cyber-bg {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 0% 0%, rgba(59, 130, 246, 0.15) 0, transparent 35%),
                radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.15) 0, transparent 35%);
            z-index: -1;
        }

        .glass-panel { 
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-panel:hover {
            border-color: rgba(59, 130, 246, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Fixed the background-clip warning here */
        .stat-value {
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text; /* Standard property added */
            -webkit-text-fill-color: transparent;
        }

        .aura-bar {
            height: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 100px;
        }

        .aura-fill {
            height: 100%;
            border-radius: 100px;
            background: linear-gradient(90deg, #3b82f6, #9333ea);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="cyber-bg"></div>

    <nav class="max-w-7xl mx-auto mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
        <div class="flex items-center gap-5">
            <div class="w-14 h-14 bg-gradient-to-br from-blue-600 to-purple-600 rounded-2xl flex items-center justify-center shadow-[0_0_30px_rgba(59,130,246,0.4)]">
                <i class="fas fa-microchip text-white text-2xl"></i>
            </div>
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight">QUANTUM<span class="text-blue-500">.LOGS</span></h1>
                <div class="flex items-center gap-2 mt-1">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    <p id="meet-id" class="text-gray-400 font-mono text-[10px] tracking-widest uppercase">ID: INITIALIZING...</p>
                </div>
            </div>
        </div>
        <div class="flex gap-3 no-print">
            <button onclick="location.href='dashboard.html'" class="px-5 py-2.5 rounded-xl text-xs font-bold border border-white/10 hover:bg-white/5 transition-all flex items-center gap-2">
                <i class="fas fa-home"></i> TERMINAL
            </button>
            <button onclick="window.print()" class="bg-white text-black px-6 py-2.5 rounded-xl text-xs font-extrabold hover:bg-blue-500 hover:text-white transition-all shadow-xl">
                EXPORT ARCHIVE
            </button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
        <div class="glass-panel p-8 relative overflow-hidden group">
            <div class="absolute -right-4 -top-4 text-white/5 text-7xl group-hover:text-blue-500/10 transition-colors"><i class="fas fa-users"></i></div>
            <p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1">Active Entities</p>
            <h2 id="total-users" class="text-5xl stat-value">0</h2>
        </div>
        <div class="glass-panel p-8 border-b-2 border-blue-500/50">
            <p class="text-[10px] font-black text-blue-400/80 uppercase tracking-widest mb-1">Focus Frequency</p>
            <h2 id="avg-attention" class="text-5xl stat-value" style="background: linear-gradient(to bottom, #fff, #3b82f6); -webkit-background-clip: text; background-clip: text;">0%</h2>
        </div>
        <div class="glass-panel p-8 border-b-2 border-purple-500/50">
            <p class="text-[10px] font-black text-purple-400/80 uppercase tracking-widest mb-1">Collective Aura</p>
            <h2 id="top-mood" class="text-3xl stat-value uppercase" style="background: linear-gradient(to bottom, #fff, #a855f7); -webkit-background-clip: text; background-clip: text;">Neutral</h2>
        </div>
    </div>

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8 mb-10">
        <div class="glass-panel p-8">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-xs font-black uppercase text-gray-400 tracking-widest">Attention Waveform</h3>
                <span class="px-3 py-1 bg-blue-500/10 text-blue-400 text-[10px] rounded-full border border-blue-500/20">LIVE DATA</span>
            </div>
            <div class="h-72"><canvas id="attentionChart"></canvas></div>
        </div>
        <div class="glass-panel p-8">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-xs font-black uppercase text-gray-400 tracking-widest">Emotion Distribution</h3>
                <span class="px-3 py-1 bg-purple-500/10 text-purple-400 text-[10px] rounded-full border border-purple-500/20">SENTIMENT AI</span>
            </div>
            <div class="h-72 relative">
                <canvas id="emotionChart"></canvas>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto">
        <div class="glass-panel overflow-hidden border border-white/5">
            <div class="p-6 border-b border-white/5 bg-white/5">
                <h3 class="text-xs font-black uppercase tracking-widest text-gray-300">Detailed Sync Analysis</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-gray-500 text-[9px] uppercase font-black tracking-[0.2em] bg-black/20">
                            <th class="p-6">Participant</th>
                            <th class="p-6">Sync Stability</th>
                            <th class="p-6">Emotional State</th>
                            <th class="p-6 text-right">Protocol</th>
                        </tr>
                    </thead>
                    <tbody id="student-list" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const dummyData = [
            { name: "Alpha", avgAttention: 85, topEmotion: "Happy" },
            { name: "Bravo", avgAttention: 42, topEmotion: "Confused" },
            { name: "Charlie", avgAttention: 91, topEmotion: "Neutral" },
            { name: "Delta", avgAttention: 65, topEmotion: "Neutral" }
        ];

        const meetId = new URLSearchParams(window.location.search).get('id') || 'QX-99';
        document.getElementById('meet-id').innerText = `SESSION_LOG // ${meetId.toUpperCase()}`;

        function init() {
            const userStr = localStorage.getItem('meet_user');
            const hostName = userStr ? JSON.parse(userStr).name : null;

            if(hostName && meetId) {
                fetch(`/api/history/${hostName}`).then(res => res.json()).then(data => {
                    const meeting = data.find(m => m.meetingId === meetId);
                    renderReport(meeting || {participants: dummyData});
                }).catch(() => renderReport({participants: dummyData}));
            } else {
                renderReport({participants: dummyData});
            }
        }

        function renderReport(meeting) {
            const p = meeting.participants;
            document.getElementById('total-users').innerText = p.length;
            const totalAtt = p.reduce((sum, item) => sum + (item.avgAttention || 0), 0);
            document.getElementById('avg-attention').innerText = Math.round(totalAtt / (p.length || 1)) + "%";

            Chart.defaults.color = 'rgba(255,255,255,0.4)';
            
            // Bar Chart
            const ctxBar = document.getElementById('attentionChart').getContext('2d');
            const barGrad = ctxBar.createLinearGradient(0, 0, 0, 300);
            barGrad.addColorStop(0, '#3b82f6');
            barGrad.addColorStop(1, 'rgba(59, 130, 246, 0.05)');

            new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: p.map(i => i.name),
                    datasets: [{ 
                        data: p.map(i => i.avgAttention), 
                        backgroundColor: barGrad,
                        borderColor: '#3b82f6',
                        borderWidth: 1.5,
                        borderRadius: 12
                    }]
                },
                options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            // Doughnut Chart
            new Chart(document.getElementById('emotionChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Neutral', 'Happy', 'Sad', 'Confused'],
                    datasets: [{ 
                        data: [40, 30, 20, 10], 
                        backgroundColor: ['#3b82f6', '#8b5cf6', '#f43f5e', '#fbbf24'], 
                        hoverOffset: 20,
                        borderWidth: 0
                    }]
                },
                options: { maintainAspectRatio: false, cutout: '82%' }
            });

            const list = document.getElementById('student-list');
            p.forEach(student => {
                const isExcellent = student.avgAttention > 70;
                list.innerHTML += `
                    <tr class="hover:bg-white/[0.02] transition-colors group">
                        <td class="p-6 font-bold text-sm tracking-tight">${student.name}</td>
                        <td class="p-6">
                            <div class="aura-bar w-32 mb-1.5"><div class="aura-fill" style="width: ${student.avgAttention}%"></div></div>
                            <span class="text-[9px] font-bold text-blue-400 opacity-80">${student.avgAttention}% STABILITY</span>
                        </td>
                        <td class="p-6 uppercase text-[10px] font-bold tracking-widest text-gray-400">${student.topEmotion || 'NEUTRAL'}</td>
                        <td class="p-6 text-right font-black text-[10px] ${isExcellent ? 'text-green-500' : 'text-red-500'}">
                            <i class="fas ${isExcellent ? 'fa-bolt' : 'fa-low-vision'} mr-1"></i> ${isExcellent ? 'OPTIMAL' : 'LOW_SYNC'}
                        </td>
                    </tr>`;
            });
        }
        init();
    </script>


<button
  onclick="location.href='aimeetanalysis.html?id=QX-99'"
  class="px-5 py-2 rounded-xl bg-blue-500 text-white text-xs font-bold">
  🤖 AI ANALYSIS
</button>


</body>
</html>
